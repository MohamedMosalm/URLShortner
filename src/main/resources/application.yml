server:
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/urlshortener
    username: postgres
    password: postgres
  sql:
    init:
      mode: always
  cache:
    redis:
      time-to-live: 1h
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  mvc:
    problemdetails:
      enabled: true

app:
  base-url: ${APP_BASE_URL:}
  code-length: 6
  auth:
    secret: ${APP_AUTH_SECRET:dev-only-secret-change-me-0123456789}
