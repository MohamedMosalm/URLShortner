apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener
spec:
  replicas: 2
  selector:
    matchLabels: { app: url-shortener }
  template:
    metadata:
      labels: { app: url-shortener }
    spec:
      containers:
        - name: url-shortener
          image: docker.io/mohamedmosalm/url-shortener:1
          ports:
            - containerPort: 8080
          env:
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres:5432/urlshortener" }
            - { name: SPRING_DATA_REDIS_HOST, value: redis }
---
apiVersion: v1
kind: Service
metadata:
  name: url-shortener
spec:
  selector: { app: url-shortener }
  ports:
    - port: 8080
